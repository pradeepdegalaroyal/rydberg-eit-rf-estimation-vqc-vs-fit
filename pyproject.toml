[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rydberg-est"
version = "0.1.0"
description = "Rydberg-EIT RF electrometry: model fit vs learned vs variational-quantum amplitude estimators"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Degala Chenchupradeep" }]
dependencies = ["numpy", "pandas", "matplotlib", "torch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
